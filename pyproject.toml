[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "air-measurements"
version = "0.1.0"
description = "ETL pipeline for OpenAQ air quality data to NetCDF-CF conversion"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Truffier" }
]
keywords = ["openaq", "netcdf", "xarray", "cartopy", "ecmwf", "air-quality"]

# Dépendances principales du pipeline
dependencies = [
    "pandas>=2.0.0",
    "xarray>=2023.0.0",
    "netcdf4>=1.6.0",
    "h5netcdf>=1.2.0",
    "matplotlib>=3.7.0",
    "cartopy>=0.21.0",
    "requests>=2.28.0",
    "urllib3>=2.0.0",
]

# Dépendances optionnelles pour les dev / tests
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# Raccourci pour lancer ton pipeline en CLI (optionnel)
[project.scripts]
run-etl = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]
